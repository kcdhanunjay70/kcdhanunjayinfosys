name: KCDI CI/CD - Latest Commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcdi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node.js Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show commit information
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          git log -1 --format='%h %s (%an)'

      - name: Check backend/server.js syntax
        run: node --check backend/server.js

      - name: Check all backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find backend -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) ! -path '*/node_modules/*' -print0)

  deploy:
    name: Trigger Render Deploy (optional)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook if configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'No deploy hook configured. Render GitHub auto-deploy can handle deployment.'
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo 'Render deploy requested (not yet confirmed live).'
