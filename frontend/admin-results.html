<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Exam Results</title><style>body{font-family:system-ui;background:#f5f7fb;margin:0;padding:24px;color:#182235}main{max-width:1050px;margin:auto}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}button{padding:10px 18px;cursor:pointer}a{color:#1457a6}</style></head><body><main><h1>Student Exam Results</h1><p><a href="/admin-dashboard.html">← Admin Dashboard</a></p><button id="refresh">Refresh Results</button><p id="status" role="status"></p><div style="overflow-x:auto"><table><thead><tr><th>Student ID</th><th>Exam</th><th>Marks</th><th>Percentage</th><th>Rank</th><th>Completed</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const statusEl=document.getElementById('status'), rows=document.getElementById('rows');
function token(){try{return localStorage.getItem('adminToken')||localStorage.getItem('token')||JSON.parse(localStorage.getItem('kcd_auth')||'{}').token||''}catch{return ''}}
function cell(tr,value){const td=document.createElement('td');td.textContent=String(value??'-');tr.appendChild(td)}
async function load(){rows.replaceChildren();statusEl.textContent='Loading…';try{const r=await fetch('/api/results/admin/history',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error(r.status===403?'Admin permission required':'Please log in as admin ('+r.status+')');const data=await r.json();for(const item of data.results||[]){const tr=document.createElement('tr');for(const val of [item.studentId,item.exam,item.score,item.percentage,item.rank,item.completedAt?new Date(item.completedAt).toLocaleString():'-'])cell(tr,val);rows.appendChild(tr)}statusEl.textContent=(data.results||[]).length+' results loaded (latest 100)'}catch(e){statusEl.textContent=e.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
