<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard — KCDHANUNJAY INFOSYS</title><link rel="stylesheet" href="/access.css"></head><body><main class="shell"><section class="panel"><h1>Student Dashboard</h1><p id="welcome">Checking account…</p><p><a href="/">Home</a> · <a href="/my-payments.html">My payments</a></p><button id="logout">Logout</button></section></main><script>const t=localStorage.getItem('token');if(!t)location.replace('/login.html');else fetch('/api/auth/verify',{headers:{Authorization:'Bearer '+t}}).then(r=>{if(!r.ok)throw Error('Session expired');return r.json()}).then(d=>{document.getElementById('welcome').textContent='Welcome, '+d.user.name+' ('+d.user.username+')'}).catch(()=>location.replace('/login.html'));document.getElementById('logout').onclick=()=>{localStorage.removeItem('token');localStorage.removeItem('user');location.replace('/login.html')};</script></body></html>
