<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Payments</title><link rel="stylesheet" href="/access.css"><main class="shell"><section class="panel"><h1>My Exam Payments</h1><p>Pending = awaiting admin review; Approved = exam access enabled; Rejected = contact support.</p><div id="items">Loading…</div><p><a href="/payment.html">Payment page</a></p></section></main><script>
const token=localStorage.getItem('token')||JSON.parse(localStorage.getItem('kcd_auth')||'{}').token||JSON.parse(localStorage.getItem('kcd_access')||'{}').token;if(!token)location.href='/login.html';fetch('/api/payments/history',{headers:{Authorization:'Bearer '+token}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message||'Failed');const el=document.getElementById('items');el.replaceChildren();for(const p of d.payments){const item=document.createElement('p');item.textContent=[p.exam_title||p.exam_type,'₹'+p.amount,p.status==='paid'?'Approved':p.status==='created'?'Pending':'Rejected',p.created_at].join(' | ');el.append(item)}if(!d.payments.length)el.textContent='No payments yet.'}).catch(e=>document.getElementById('items').textContent=e.message);
</script></html>
