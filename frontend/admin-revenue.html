<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Revenue Dashboard</title><link rel="stylesheet" href="/access.css"><main class="shell"><section class="panel"><h1>Revenue & Payment Audit</h1><p>Gross approved INR payments only. Verify bank credits separately; refunds, fees and taxes are not deducted.</p><button id="refresh">Refresh</button><div id="summary" aria-live="polite">Loading…</div><h2>Recent Approved Payments</h2><div id="recent"></div><h2>Admin Review Audit</h2><div id="audit"></div><p><a href="/admin-payments.html">Payment Approvals</a> · <a href="/admin-dashboard.html">Admin Dashboard</a></p></section></main><script>
const token=localStorage.getItem('token')||JSON.parse(localStorage.getItem('kcd_auth')||'{}').token||JSON.parse(localStorage.getItem('kcd_access')||'{}').token;
if(!token)location.href='/login.html?role=admin&redirect='+encodeURIComponent(location.pathname);
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n||0);
const row=(items)=>{const p=document.createElement('p');p.textContent=items.map(x=>String(x??'—')).join(' | ');return p};
async function load(){try{const headers={Authorization:'Bearer '+token};const [r,a]=await Promise.all([fetch('/api/admin/revenue-summary',{headers}),fetch('/api/admin/payment-audit',{headers})]);const d=await r.json(),l=await a.json();if(!r.ok||!a.ok)throw Error(d.message||l.message||'Request failed');document.getElementById('summary').replaceChildren(row(['Approved: '+d.approvedCount,'Gross: '+money(d.grossRevenue),'Pending: '+d.pendingCount,'Rejected: '+d.rejectedCount]));const recent=document.getElementById('recent');recent.replaceChildren(...d.recent.map(p=>row([p.exam_title||p.exam_type,money(p.amount),p.reviewed_at||p.created_at])));const audit=document.getElementById('audit');audit.replaceChildren(...l.logs.map(x=>row([x.created_at,x.actor,x.previous_status+' → '+x.new_status,money(x.amount),x.reference_id,x.note])))}catch(e){document.getElementById('summary').textContent=e.message}}
document.getElementById('refresh').onclick=load;load();
</script></html>
