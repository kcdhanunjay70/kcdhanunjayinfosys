<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Approvals</title><link rel="stylesheet" href="/access.css"><main class="shell"><section class="panel"><h1>PhonePe Payment Approvals</h1><p>Verify the UTR and ₹10 credit in your PhonePe account before approving. Screenshots alone are not proof.</p><button id="reload">Refresh requests</button><div id="items"></div><p><a href="/admin-revenue.html">Revenue & Audit</a> · <a href="/admin-dashboard.html">Admin dashboard</a></p></section></main><script>
const token=localStorage.getItem('token')||JSON.parse(localStorage.getItem('kcd_auth')||'{}').token||JSON.parse(localStorage.getItem('kcd_access')||'{}').token;
if(!token)location.href='/login.html?role=admin&redirect='+encodeURIComponent(location.pathname);
const el=document.getElementById('items');
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{Authorization:'Bearer '+token,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d;}
async function load(){el.textContent='Loading…';try{const d=await api('/api/admin/payment-requests');el.replaceChildren();for(const p of d.payments){const box=document.createElement('div');box.style='padding:15px;margin:12px 0;border:1px solid #999;border-radius:8px';const t=document.createElement('p');t.textContent=[p.name,p.email,p.exam_title,'₹'+p.amount,'UTR: '+p.reference_id,'Status: '+p.status].join(' | ');box.append(t);if(p.screenshot_url){const b=document.createElement('button');b.textContent='View screenshot';b.onclick=async()=>{try{const r=await fetch(p.screenshot_url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Cannot load screenshot');const url=URL.createObjectURL(await r.blob());const img=document.createElement('img');img.src=url;img.style='max-width:300px;display:block';img.onload=()=>URL.revokeObjectURL(url);box.append(img);b.disabled=true;}catch(e){alert(e.message)}};box.append(b)}for(const [status,label] of [['paid','Approve'],['failed','Reject']]){const b=document.createElement('button');b.textContent=label;b.style.margin='8px';b.onclick=async()=>{if(!confirm(label+' this payment? Verify the transaction in PhonePe first.'))return;try{await api('/api/admin/payment-requests/'+encodeURIComponent(p.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}catch(e){alert(e.message)}};box.append(b)}el.append(box)}}catch(e){el.textContent=e.message}}
document.getElementById('reload').onclick=load;load();
</script></html>
